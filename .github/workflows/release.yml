name: Release
on:
  push:
    tags: ['v*']
  # Rehearsal on main: same regression, packaging and checks, no Release is created.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    # The exact tagged commit must pass the complete regression before anything is published.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Tag is on main and matches the package version and release notes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          VERSION=$(node -p "require('./browser-extension/package.json').version")
          if [ "$REHEARSAL" = true ]; then TAG="v$VERSION"; echo "TAG=$TAG" >> "$GITHUB_ENV"; fi
          [ "v$VERSION" = "$TAG" ] || { echo "::error::package.json is $VERSION, tag is $TAG"; exit 1; }
          test -f "browser-extension/docs/releases/$TAG.md" || { echo "::error::missing browser-extension/docs/releases/$TAG.md"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build release ZIP, runtime package, installer and checksums
        working-directory: browser-extension
        run: |
          npm ci
          npm run zip
          ZIP=".output/qc-reframe-extension-$VERSION-chrome.zip"
          test -f "$ZIP" || { ls .output; echo "::error::expected $ZIP"; exit 1; }
          [ "$(unzip -p "$ZIP" manifest.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" = "$VERSION" ] || { echo '::error::ZIP manifest version mismatch'; exit 1; }
          # The runtime package and installer keep fixed names so releases/latest/download/ always resolves.
          npm run package:runtime
          cp scripts/install.sh .output/install.sh
          (cd .output && sha256sum "$(basename "$ZIP")" qc-reframe-runtime.tar.gz install.sh > SHA256SUMS)
          echo "ZIP=browser-extension/$ZIP" >> "$GITHUB_ENV"
      # A separate step, so the signing key is never in the environment of npm ci or the build.
      # Installed copies verify SHA256SUMS.sig with the public key in scripts/install.sh before upgrading.
      - name: Sign checksums
        working-directory: browser-extension
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs .output/SHA256SUMS > .output/SHA256SUMS.sig
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=()
          case "$TAG" in *-*) FLAGS+=(--prerelease);; esac
          NOTES="browser-extension/docs/releases/$TAG.md"
          TITLE=$(sed -n '1s/^# //p' "$NOTES")
          if [ "$REHEARSAL" = true ]; then
            echo "Rehearsal: would publish $TAG ($TITLE) with $ZIP, qc-reframe-runtime.tar.gz, install.sh, SHA256SUMS and SHA256SUMS.sig" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          OUT=browser-extension/.output
          gh release create "$TAG" --verify-tag --title "${TITLE:-$TAG}" --notes-file "$NOTES" "${FLAGS[@]}" \
            "$ZIP" "$OUT/qc-reframe-runtime.tar.gz" "$OUT/install.sh" "$OUT/SHA256SUMS" "$OUT/SHA256SUMS.sig"
