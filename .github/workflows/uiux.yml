name: UIUX infrastructure
on:
  pull_request:
  push:
    branches: [main]
  # Daily backstop for runner/browser drift; code changes are verified by the events above.
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      require_visual:
        description: Require reviewed Linux visual baselines (missing or incompatible baselines fail)
        type: boolean
        default: false
  # Release verification of the exact tagged commit.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: uiux-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  uiux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUIRE_VISUAL: ${{ inputs.require_visual || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Classify complete event diff
        id: scope
        run: node agent-tool/ci.mjs classify
      - name: Check documentation diff and repository links
        if: steps.scope.outputs.mode == 'docs'
        run: node agent-tool/ci.mjs docs
      - name: Enable npm cache
        if: steps.scope.outputs.mode == 'full'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install dependencies and Chromium
        if: steps.scope.outputs.mode == 'full'
        working-directory: browser-extension
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/reframe-ui"
          echo "TMPDIR=$RUNNER_TEMP/reframe-ui" >> "$GITHUB_ENV"
      - name: Build once (fingerprinted for UI tools) and type check
        if: steps.scope.outputs.mode == 'full'
        run: |
          node agent-tool/ui.mjs prepare
          npm --prefix browser-extension run compile
      - name: Product tests
        if: steps.scope.outputs.mode == 'full'
        working-directory: browser-extension
        run: npm test
      - name: Tool tests
        if: steps.scope.outputs.mode == 'full'
        # UI tool tests share the validation lock, so files run one at a time.
        run: node --test --test-concurrency=1 agent-tool/*.test.mjs agent-tool/ui/*.test.mjs
      - name: UI gate (all registered scenarios and isolated extension)
        if: steps.scope.outputs.mode == 'full'
        run: |
          BASELINES=browser-extension/docs/uiux/visual-baselines/linux
          TIER=browser
          if [ "$REQUIRE_VISUAL" = 'true' ] || [ -n "$(find "$BASELINES" -name manifest.json -print -quit 2>/dev/null)" ]; then TIER=full; fi
          # Changed-source rules compare against the classified base; without one, compare everything.
          BASE='${{ steps.scope.outputs.base }}'
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then BASE=$(git hash-object -t tree /dev/null); fi
          node agent-tool/ui.mjs gate --tier "$TIER" --no-build --base "$BASE" --baseline-dir "$BASELINES" --reason ci
          if [ "$TIER" = browser ]; then echo 'Visual acceptance is pending human review of the uploaded Linux candidates.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Reports, candidates, screenshots and failure traces
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: uiux-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reframe-ui
          if-no-files-found: ignore
          retention-days: 14
  alert:
    needs: uiux
    if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the main regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='CI: main 回归失败'
          BODY="$GITHUB_EVENT_NAME 运行失败：$RUN_URL（提交 $GITHUB_SHA）"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then gh issue comment "$NUMBER" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
